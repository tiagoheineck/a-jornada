name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checar sintaxe do JavaScript
        run: for f in $(find js -name '*.js') sw.js; do node --check "$f" || exit 1; done
      - name: Validar manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js css js assets _site/
          sed -i "s/__VERSAO__/${GITHUB_SHA::7}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
